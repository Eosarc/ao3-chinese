name: Aria Glossary Review & Wiki Sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'glossaries/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lint-and-review:
    name: Aria 术语表智能审查
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: 检出基础仓库代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
          path: base_repo

      - name: 检出 PR 分支代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr_repo
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 获取 PR 变动的术语表文件列表
        id: get_changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const glossaryFiles = files
              .map(f => f.filename)
              .filter(f => f.startsWith('glossaries/') && !f.endsWith('.json'));
            core.setOutput('files', glossaryFiles.join(' '));
            console.log('PR 变动术语表文件:', glossaryFiles);

      - name: 自动修复缺失的 .txt 后缀（仅针对本次变动文件）
        id: auto_fix
        if: steps.get_changed.outputs.files != ''
        run: |
          cd pr_repo
          node -e '
            import fs from "node:fs";
            import path from "node:path";
            const files = "${{ steps.get_changed.outputs.files }}".trim().split(/\s+/).filter(Boolean);
            let fixed = [];
            for (const f of files) {
              if (f.startsWith(".") || f.endsWith(".json") || f.endsWith(".txt")) continue;
              if (fs.existsSync(f) && fs.statSync(f).isFile()) {
                fs.renameSync(f, f + ".txt");
                fixed.push(f);
              }
            }
            if (fixed.length > 0) {
              fs.writeFileSync(".auto_fixed_files.json", JSON.stringify(fixed));
              console.log("Fixed files in PR:", fixed);
            }
          '
          if [ -f .auto_fixed_files.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add glossaries/
            git commit -m "chore: 自动为在线术语表文件补充 .txt 后缀"
            git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
          fi

      - name: 自动标准化 PR 标题
        id: format_title
        if: steps.get_changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const glossaryFiles = files.filter(f => f.filename.startsWith('glossaries/') && !f.filename.endsWith('.json'));
            if (glossaryFiles.length === 0) return;

            const targetFile = glossaryFiles[0];
            const isAdded = targetFile.status === 'added';
            const actionText = isAdded ? '新增' : '更新';

            // 优先从 PR 描述中提取作品原名，其次使用文件名
            let workName = '';
            const prBody = pr.body || '';
            const match = prBody.match(/作品原名[^\n]*\n+([^\n#\-]+)/i) || prBody.match(/作品原名[^\n]*[:：]\s*([^\n]+)/i);
            if (match) {
              const clean = match[1].trim().replace(/^\{|\}$/g, '').replace(/^`|`$/g, '').replace(/^例如[：:]\s*/, '').trim();
              if (clean && !clean.includes('BanG Dream')) {
                workName = clean;
              }
            }
            if (!workName) {
              const base = targetFile.filename.replace(/^glossaries\//, '').replace(/\.txt$/, '');
              workName = base.replace(/_/g, ' ');
            }

            const standardTitle = `${actionText} ${workName} 术语表`;
            if (pr.title !== standardTitle) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                title: standardTitle,
              });
              console.log(`PR 标题已由 Aria 自动标准化为: "${standardTitle}"`);
            }

      - name: 运行 Aria 质检脚本
        id: aria_linter
        if: steps.get_changed.outputs.files != ''
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          cd pr_repo
          cp ../base_repo/tools/glossary-linter.mjs tools/glossary-linter.mjs
          TARGETS=""
          for f in ${{ steps.get_changed.outputs.files }}; do
            if [ -f "$f" ]; then
              TARGETS="$TARGETS $f"
            elif [ -f "${f}.txt" ]; then
              TARGETS="$TARGETS ${f}.txt"
            fi
          done
          echo "质检目标文件: $TARGETS"
          CODE=0
          node tools/glossary-linter.mjs --head-branch "${{ github.event.pull_request.head.ref }}" $TARGETS > linter_report.md || CODE=$?
          echo "LINTER_EXIT_CODE=$CODE" >> $GITHUB_ENV
          rm -f .auto_fixed_files.json

      - name: 发布或原地更新 Aria 审查评论
        if: steps.get_changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'pr_repo/linter_report.md';
            if (!fs.existsSync(reportPath)) return;
            const reportBody = fs.readFileSync(reportPath, 'utf-8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const ariaComment = comments.find(c => c.body.includes('<!-- aria-glossary-review -->'));

            if (ariaComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ariaComment.id,
                body: reportBody
              });
              console.log('Aria 审查评论已就地更新。');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reportBody
              });
              console.log('Aria 审查评论已创建。');
            }

      - name: 判定质检状态
        if: steps.get_changed.outputs.files != ''
        run: |
          if [ "${{ env.LINTER_EXIT_CODE }}" != "0" ]; then
            echo "❌ Aria 检测到阻断性语法错误，请根据评论提示进行修改。"
            exit 1
          else
            echo "✅ Aria 质检通过。"
          fi

  sync-to-wiki:
    name: 同步新术语表至 Wiki
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      HAS_WIKI_PAT: ${{ secrets.WIKI_PAT != '' }}

    steps:
      - name: 检查 Wiki 凭据是否具备
        if: env.HAS_WIKI_PAT != 'true'
        run: |
          echo "未检测到 WIKI_PAT 密钥，跳过 Wiki 自动写入。"
          exit 0

      - name: 检出基础仓库最新代码
        if: env.HAS_WIKI_PAT == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
          path: main_repo

      - name: 检出 Wiki 仓库
        if: env.HAS_WIKI_PAT == 'true'
        continue-on-error: true
        id: checkout_wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.WIKI_PAT }}
          path: wiki_repo

      - name: 写入 Wiki 在线术语库
        if: steps.checkout_wiki.outcome == 'success'
        run: |
          cd main_repo
          node -e '
            import fs from "node:fs";
            import path from "node:path";

            const prBody = process.env.PR_BODY || "";
            const prNumber = process.env.PR_NUMBER;
            const repoFullName = process.env.GITHUB_REPOSITORY;
            const wikiFile = path.resolve("../wiki_repo/在线术语库.md");

            if (!fs.existsSync(wikiFile)) {
              console.log("未找到 Wiki 在线术语库.md，跳过同步。");
              process.exit(0);
            }

            let wikiContent = fs.readFileSync(wikiFile, "utf-8");

            function cleanValue(str, exampleKeyword) {
              if (!str) return "";
              let res = str.trim();
              if (res.startsWith("{") && res.endsWith("}")) {
                res = res.slice(1, -1).trim();
              }
              res = res.replace(/^`|`$/g, "").trim();
              if (res.startsWith("例如：") || res.startsWith("例如:")) {
                res = res.replace(/^例如[：:]\s*/, "").trim();
                if (exampleKeyword && res.includes(exampleKeyword)) return "";
              }
              if (exampleKeyword && res.includes(exampleKeyword)) return "";
              return res;
            }

            function extractField(body, pattern, exampleKeyword) {
              const lines = body.split("\n");
              for (let i = 0; i < lines.length; i++) {
                if (pattern.test(lines[i])) {
                  const afterColon = lines[i].replace(/^[^:：]+[:：]/, "").trim();
                  if (afterColon) {
                    const val = cleanValue(afterColon, exampleKeyword);
                    if (val) return val;
                  }
                  for (let j = i + 1; j < lines.length; j++) {
                    const next = lines[j].trim();
                    if (!next) continue;
                    if (next.startsWith("-") || next.startsWith("#")) break;
                    const val = cleanValue(next, exampleKeyword);
                    if (val) return val;
                  }
                }
              }
              return "";
            }

            // 检查是否同意收录至 Wiki
            const agreeInclusion = /\[[xX]\]\s*同意收录至\s*AO3\s*Translator/i.test(prBody);
            if (!agreeInclusion) {
              console.log("贡献者未勾选「同意收录至 AO3 Translator 官方在线术语库」，跳过 Wiki 写入。");
              process.exit(0);
            }

            // 提取 PR 模板字段
            const prWorkName = extractField(prBody, /作品原名/, "BanG Dream");
            const prAliases = extractField(prBody, /译名|别名|搜索标签/, "梦想协奏曲");
            const prMaintNick = extractField(prBody, /维护者昵称/, "V-Lipset");
            const prMaintLink = extractField(prBody, /主页链接|反馈联系方式/, "github.com/V-Lipset");
            const prGeneralMaint = extractField(prBody, /维护者信息/, "V-Lipset");
            const prRawUrl = extractField(prBody, /Raw\s*链接/, "raw.githubusercontent.com");

            // 获取本次合并的新增术语表文件
            const glossariesDir = path.resolve("glossaries");
            const files = fs.readdirSync(glossariesDir).filter(f => f.endsWith(".txt"));

            for (const f of files) {
              const baseName = f.replace(/\.txt$/, "");
              const defaultRawUrl = `https://raw.githubusercontent.com/${repoFullName}/main/glossaries/${encodeURIComponent(f)}`;
              const rawUrl = prRawUrl || defaultRawUrl;
              
              // 检查 Wiki 是否已收录（通过文件名或作品原名或链接）
              const alreadyExists = wikiContent.includes(`/${encodeURIComponent(f)}`) || 
                                   wikiContent.includes(`/${f}`) ||
                                   (prRawUrl && wikiContent.includes(prRawUrl)) ||
                                   (prWorkName && wikiContent.includes(`### ${prWorkName}`));

              if (alreadyExists) {
                console.log(`术语表 "${f}" 已在 Wiki 中收录，保持 Wiki 不动。`);
                continue;
              }

              console.log(`检测到新增术语表 "${f}"，准备写入 Wiki...`);

              // 读取文件内头部维护者作为兜底
              let fileMaintainer = "";
              try {
                const fileText = fs.readFileSync(path.join(glossariesDir, f), "utf-8");
                const mLine = fileText.split("\n").find(l => l.trim().startsWith("维护者"));
                if (mLine) fileMaintainer = mLine.replace(/^维护者[:：]\s*/, "").trim();
              } catch (e) {}

              const workTitle = prWorkName || baseName.replace(/_/g, " ");
              const aliases = prAliases || "";
              
              // 构造标准 Wiki 条目
              let newEntry = `\n### ${workTitle}\n`;
              if (aliases) {
                newEntry += `* 译名：${aliases}\n`;
              }
              newEntry += `* 链接：[${rawUrl}](${rawUrl})\n`;

              // 维护者字段处理
              if (prMaintNick && prMaintLink) {
                newEntry += `* 维护者：[${prMaintNick}](${prMaintLink})\n`;
              } else {
                const mRaw = prGeneralMaint || prMaintNick || prMaintLink || fileMaintainer || "社区贡献者";
                const maintLinkMatch = mRaw.match(/\[(.*?)\]\((.*?)\)/);
                if (maintLinkMatch) {
                  newEntry += `* 维护者：[${maintLinkMatch[1].trim()}](${maintLinkMatch[2].trim()})\n`;
                } else if (mRaw.startsWith("http")) {
                  newEntry += `* 维护者：[${mRaw}](${mRaw})\n`;
                } else if (mRaw.includes("@")) {
                  newEntry += `* 维护者：[${mRaw}](mailto:${mRaw})\n`;
                } else {
                  newEntry += `* 维护者：[${mRaw}](https://github.com/${mRaw})\n`;
                }
              }

              wikiContent += newEntry;
              fs.writeFileSync(wikiFile, wikiContent, "utf-8");
              console.log(`已将 "${workTitle}" 写入 Wiki。`);
            }
          '
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 提交并推送到 Wiki 仓库
        if: steps.checkout_wiki.outcome == 'success'
        run: |
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 在线术语库.md
          if git diff --staged --quiet; then
            echo "Wiki 内容无变动，无需推送。"
          else
            git commit -m "docs: 自动收录来自 PR #${{ github.event.pull_request.number }} 的新增在线术语表"
            git push origin master || git push origin main
            echo "Wiki 更新推送成功，将自动触发 sync_wiki_to_json 工作流。"
          fi
